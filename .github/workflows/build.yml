name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"

          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Required Android SDK already installed."
          else
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "Downloading Android command-line tools"
              curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
              unzip -q /tmp/android-tools.zip -d /tmp/android-tools
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/manual"
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/manual/bin/sdkmanager"
            fi

            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nearby-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
